<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoRa Campus Monitor — 3D Wiring</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9edf2; color: #1f2937; overflow: hidden; }
    #topbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #111827; color: #fff; z-index: 3; }
    #topbar .title { font-weight: 700; margin-right: 12px; white-space: nowrap; }
    #topbar button { background: #374151; color: #e5e7eb; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
    #topbar button.active { background: #2563eb; color: #fff; }
    #topbar label { font-size: 13px; color: #d1d5db; margin-left: 8px; white-space: nowrap; }
    #view { position: absolute; top: 52px; left: 0; right: 360px; bottom: 0; }
    #panel { position: absolute; top: 52px; right: 0; width: 360px; bottom: 0; overflow-y: auto; background: #fff; border-left: 1px solid #d1d5db; z-index: 2; }
    #panel h2 { font-size: 15px; margin: 14px 14px 4px; }
    #panel p { font-size: 12px; color: #6b7280; margin: 0 14px 10px; line-height: 1.4; }
    #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 14px 14px 4px; }
    .conn { display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .conn:hover { background: #f1f5f9; }
    .conn.sel { background: #dbeafe; }
    .sw { width: 22px; height: 8px; border-radius: 4px; flex: none; border: 1px solid rgba(0,0,0,.25); }
    .conn .txt { flex: 1; }
    .conn .note { color: #6b7280; font-size: 11px; }
    #tip { position: absolute; pointer-events: none; background: rgba(17,24,39,.92); color: #fff; padding: 6px 9px; border-radius: 6px; font-size: 12.5px; z-index: 4; display: none; max-width: 320px; }
    #legend { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.92); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; z-index: 2; display: grid; grid-template-columns: repeat(4, auto); gap: 4px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    #legend span { display: inline-flex; align-items: center; gap: 5px; }
    #help { position: absolute; left: 12px; top: 64px; background: rgba(255,255,255,.88); border-radius: 8px; padding: 6px 10px; font-size: 11.5px; color: #374151; z-index: 2; }
    #warn { margin: 6px 14px 12px; padding: 8px 10px; background: #fef2f2; color: #991b1b; border-radius: 6px; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="title">LoRa Campus Monitor · 3D wiring</div>
    <button data-scene="system">System overview</button>
    <button data-scene="main">Main node (Raspberry Pi)</button>
    <button data-scene="node1">Field node 1 (ESP32)</button>
    <button data-scene="node2">Field node 2 (ESP32)</button>
    <label><input type="checkbox" id="pinLabels" checked> Pin labels</label>
    <label><input type="checkbox" id="rotate"> Auto-rotate</label>
  </div>
  <div id="view"></div>
  <div id="help">Drag = rotate · Right-drag = pan · Wheel = zoom · Hover a wire for details · Click a row to highlight</div>
  <div id="legend"></div>
  <div id="panel"></div>
  <div id="tip"></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="connections_3d.js?v=6"></script>
</body>
</html>
