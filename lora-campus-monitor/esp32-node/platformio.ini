; ESP32 field-node firmware for the LoRa campus monitoring system.
; Build Node 1:  pio run -e node1 -t upload
; Build Node 2:  pio run -e node2 -t upload
; Serial monitor: pio device monitor -b 115200

[platformio]
default_envs = node1, node2

[env]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0

[env:node1]
build_flags =
    ${env.build_flags}
    -DNODE_ID=1

[env:node2]
build_flags =
    ${env.build_flags}
    -DNODE_ID=2
